<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisio+ - Agendamentos</title>
</head>
<body>
    <h1>AGENDAMENTOS</h1>

    <p><a href="/principal">Voltar</a></p>

    <table border="1">
        <tr>
            <th>Data</th>
            <th>Tratamento</th>
            <th>Clientes</th>
            <th>Alterar data</th>
        </tr>
        {{#agendamentos}}
        <tr>
            <td>{{data_br}}</td>
            <td>{{tratamento}}</td>
            <td>{{cliente_nome}}</td>
            <td>
                <form method="POST" action="/agendamentos/{{id}}">
                    <input type="hidden" name="_method" value="PUT"/>

                    <input type="datetime-local" name="data_agendamento" value="{{data_input}}" required/>

                    <button>Salvar</button>
                </form>
            </td>
            <td>
                <form method="POST" action="/agendamentos/{{id}}">
                    <input type="hidden" name="_method" value="DELETE" />
                </form>
            </td>
        </tr>
        {{/agendamentos}}
    </table>

    <h2>Cadastrar Agendamento</h2>
    <form method="POST" action="/agendamentos" >
        <select name="id_tratamento" required>
            <option value="">Selecione o tratamento</option>
                {{#tratamentos}}
                <option value="{{id}}">{{placa}} - {{marca}} {{modelo}}</option>
                {{/tratamentos}}
        </select>
        <input type="datetime-local" name="data_agendamento" required />


        <input type="text" name="servico" placeholder="Serviço" />


        <button>Cadastrar</button>
    </form>
</body>
</html>
